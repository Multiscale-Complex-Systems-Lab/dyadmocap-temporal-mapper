; dymo_config.example.ini - where the data are and where results go.
; Read by both the Python and the MATLAB version.
;
; Copy this file to dymo_config.ini (same folder) and edit it. dymo_config.ini
; is git-ignored, so your paths are never committed. Without a dymo_config.ini
; both versions use the simulated data in data/simulated/generated/; Python
; writes to outputs/results/ and MATLAB to outputs/matlab_results/.
;
; data_index         : a JSON file that lists the dyads and their marker files, in
;                      the format written by data/simulated/simulate_dyad.py:
;                      {"dyads": {"<dyad>": {"files": {"casual":   {"Person 1": "<file>", "Person 2": "<file>"},
;                                                      "conflict": {"Person 1": "<file>", "Person 2": "<file>"}}}}}
;                      File names are relative to the folder of the index file.
;                      Dyad names must start with a letter and contain only
;                      letters, digits and underscores (e.g. dyad001).
; results_dir        : where the Python version writes every table and figure.
; matlab_results_dir : where the MATLAB version writes every table and figure.
;                      For real participant data, keep both OUTSIDE the repository.
; tmapper2_dir       : MATLAB only - the folder of the Temporal Mapper toolbox
;                      (a clone of github.com/Multiscale-Complex-Systems-Lab/tmapper2,
;                      at v2.2). Leave empty if tmapper_tools is already on the path.

[paths]
data_index         =
results_dir        =
matlab_results_dir =
tmapper2_dir       =
